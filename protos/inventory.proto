syntax = "proto3";

package inventory;

// ==============================================================================
// SERVICIO CENTRAL DE INVENTARIO DISTRIBUIDO
// ==============================================================================
// El servidor central es el único nodo con acceso a PostgreSQL.
// Todas las sedes y clientes remotos interactúan exclusivamente a través
// de este contrato gRPC mediante llamadas seguras y tipadas.
service InventoryService {

  // --- 1. Autenticación y Sesión ---
  // Permite a una sede o simulador autenticar sus credenciales contra el servidor.
  // Devuelve un token de sesión opaco, el rol asignado y el nombre de la sede.
  // Las llamadas subsiguientes enviarán el token en metadata ("authorization: Bearer <token>").
  rpc Login (LoginRequest) returns (LoginResponse);

  // --- 2. Consultas de Catálogo (Lectura) ---
  // Consulta la información detallada (stock y versión actual) de un producto específico.
  rpc GetProduct (GetProductRequest) returns (GetProductResponse);

  // Lista todos los productos disponibles en el inventario central.
  rpc ListProducts (ListProductsRequest) returns (ListProductsResponse);

  // --- 3. Modificaciones de Existencias (Control Optimista) ---
  // Aumenta o disminuye el stock de un producto validando expected_version de forma atómica.
  rpc AdjustStock (AdjustStockRequest) returns (AdjustStockResponse);

  // Establece una cantidad absoluta de existencias validando expected_version.
  rpc SetStock (SetStockRequest) returns (SetStockResponse);

  // --- 4. Gestión CRUD de Productos ---
  // Registra un nuevo producto en el catálogo central (restringido a rol SEDE).
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse);

  // Actualiza el nombre de un producto validando la versión esperada.
  rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductResponse);

  // Elimina un producto del catálogo verificando expected_version para evitar borrados sobre datos desactualizados.
  rpc DeleteProduct (DeleteProductRequest) returns (DeleteProductResponse);

  // --- 5. Eventos en Vivo (Server Streaming) ---
  // Abre un canal unidireccional persistente desde el servidor hacia el cliente para
  // notificar inmediatamente cualquier cambio (creación, ajuste o eliminación) en tiempo real.
  rpc WatchProducts (WatchRequest) returns (stream ProductEvent);

  // --- 6. Auditoría e Historial ---
  // Permite consultar el registro histórico inmutable de operaciones realizadas sobre el inventario.
  rpc ListMovements (ListMovementsRequest) returns (ListMovementsResponse);
}

// ==============================================================================
// ENTIDADES Y TIPOS BASE
// ==============================================================================

// Entidad Producto con versión para control de concurrencia optimista
message Product {
  string id = 1;
  string name = 2;
  int32 stock = 3;
  int64 version = 4;
}

// Tipo de evento transmitido en streaming en vivo
enum EventType {
  CREATED = 0;
  UPDATED = 1;
  DELETED = 2;
}

// Evento de notificación en tiempo real
message ProductEvent {
  EventType tipo = 1;
  Product product = 2;
  string origen_sede = 3;
  int64 timestamp = 4;
}

// Registro individual de auditoría de movimientos
message Movement {
  int32 id = 1;
  string fecha = 2;
  string usuario = 3;
  string sede = 4;
  string operacion = 5;
  string producto_id = 6;
  string detalle = 7;
  bool exito = 8;
  string mensaje = 9;
}

// ==============================================================================
// MENSAJES DE SOLICITUD Y RESPUESTA
// ==============================================================================

// 1. Login
message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string error_message = 2;
  string token = 3;
  string rol = 4;
  string sede_nombre = 5;
}

// 2. GetProduct
message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  bool success = 1;
  string error_message = 2;
  Product product = 3;
}

// 3. ListProducts
message ListProductsRequest {
}

message ListProductsResponse {
  bool success = 1;
  string error_message = 2;
  repeated Product products = 3;
}

// 4. AdjustStock
message AdjustStockRequest {
  string product_id = 1;
  int32 delta = 2;            // Cantidad a sumar (positiva) o restar (negativa)
  int64 expected_version = 3; // Versión esperada para control de concurrencia
}

message AdjustStockResponse {
  bool success = 1;
  string error_message = 2;
  bool version_conflict = 3;   // Verdadero si la versión no coincide
  Product product = 4;        // Estado actual o resultante del producto
}

// 5. SetStock
message SetStockRequest {
  string product_id = 1;
  int32 new_stock = 2;        // Nueva cantidad absoluta de existencias
  int64 expected_version = 3; // Versión esperada para control de concurrencia
}

message SetStockResponse {
  bool success = 1;
  string error_message = 2;
  bool version_conflict = 3;   // Verdadero si la versión no coincide
  Product product = 4;        // Estado actual o resultante del producto
}

// 6. CreateProduct
message CreateProductRequest {
  string product_id = 1;
  string name = 2;
  int32 stock = 3;
}

message CreateProductResponse {
  bool success = 1;
  string error_message = 2;
  bool version_conflict = 3;
  Product product = 4;
}

// 7. UpdateProduct
message UpdateProductRequest {
  string product_id = 1;
  string name = 2;
  int64 expected_version = 3;
}

message UpdateProductResponse {
  bool success = 1;
  string error_message = 2;
  bool version_conflict = 3;
  Product product = 4;
}

// 8. DeleteProduct
message DeleteProductRequest {
  string product_id = 1;
  int64 expected_version = 2;
}

message DeleteProductResponse {
  bool success = 1;
  string error_message = 2;
  bool version_conflict = 3;
  Product product = 4;
}

// 9. WatchProducts (Streaming)
message WatchRequest {
  string client_id = 1;
}

// 10. ListMovements
message ListMovementsRequest {
  int32 limite = 1;
  string product_id = 2;
}

message ListMovementsResponse {
  bool success = 1;
  string error_message = 2;
  repeated Movement movements = 3;
}
